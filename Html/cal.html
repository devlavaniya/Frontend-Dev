<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(145deg, #222, #444);
    }

    .calculator {
      width: 320px;
      background: #111;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .display {
      background: #222;
      padding: 20px;
      text-align: right;
    }

    .display input {
      width: 100%;
      font-size: 2.5rem;
      background: none;
      border: none;
      color: white;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 15px;
    }

    .btn {
      background: #333;
      color: white;
      font-size: 1.4rem;
      border: none;
      border-radius: 12px;
      height: 65px;
      transition: 0.2s;
    }

    .btn:hover {
      background: #555;
    }

    .operator {
      background: #f39c12;
      color: white;
    }

    .operator:hover {
      background: #e67e22;
    }

    .equal {
      background: #27ae60;
    }

    .equal:hover {
      background: #2ecc71;
    }

    .zero {
      grid-column: span 2;
    }

    .clear {
      background: #c0392b;
    }

    .clear:hover {
      background: #e74c3c;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <input type="text" placeholder="0" readonly />
    </div>
    <div class="buttons">
      <button class="btn clear">C</button>
      <button class="btn">±</button>
      <button class="btn">%</button>
      <button class="btn operator">÷</button>

      <button class="btn">7</button>
      <button class="btn">8</button>
      <button class="btn">9</button>
      <button class="btn operator">×</button>

      <button class="btn">4</button>
      <button class="btn">5</button>
      <button class="btn">6</button>
      <button class="btn operator">−</button>

      <button class="btn">1</button>
      <button class="btn">2</button>
      <button class="btn">3</button>
      <button class="btn operator">+</button>

      <button class="btn zero">0</button>
      <button class="btn">.</button>
      <button class="btn equal">=</button>
    </div>
  </div>
</body>
</html>
