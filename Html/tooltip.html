<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Tooltip</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
    }

    .tooltip {
      position: relative;
      display: inline-block;
      cursor: pointer;
      color: blue;
    }

    .tooltip-text {
      display: none;
      position: absolute;
      bottom: 100%; /* show above */
      left: 0;
      background: black;
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      margin-bottom: 5px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="tooltip" onclick="showText()">
    Click me
    <div class="tooltip-text" id="tooltip">Hello! I appear above 👋</div>
  </div>

  <script>
    function showText() {
      const tip = document.getElementById("tooltip");
      tip.style.display = tip.style.display === "block" ? "none" : "block";
    }
  </script>

</body>
