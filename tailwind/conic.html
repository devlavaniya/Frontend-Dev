<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conic Gradient with Degrees</title>
<style>
.gradient-box {
width: 250px;
height: 250px;
border-radius: 50%;
border: 2px solid #333;
background: conic-gradient(
red 0deg 90deg,
yellow 90deg 180deg,
green 180deg 270deg,
aqua 270deg 360deg
);
}
</style>
</head>
<body>
<h2>Conic Gradient with Angle Stops</h2>
<div class="gradient-box"></div>
</body>
</html>
